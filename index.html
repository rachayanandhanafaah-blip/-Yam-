<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>สัตตเลขลักษณากาล</title>
<meta name="description" content="จับยาม สัตตเลข ยามอัฐกาล สัตตาภิธรรม · ใช้ได้แบบออฟไลน์">
<meta name="theme-color" content="#0d1326" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f1eee6" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yam7">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0d1326;--tx:#dfe5f2;--sub:#b0bbd6;--tile:#212e4d;--line:rgba(150,180,255,.19);--card:#162038;--acc:#e3e8f4;--onacc:#0d1326}
@media (prefers-color-scheme: light){:root{--bg:#f1eee6;--tx:#26241f;--sub:#5e5a50;--tile:#e3ded0;--line:rgba(38,36,31,.15);--card:#fffdf8;--acc:#3a362e;--onacc:#fff}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Sarabun","Noto Sans Thai",sans-serif;overflow:hidden}
#dash{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);z-index:5;text-align:center}
#boot .bx{padding:24px;max-width:92vw}#boot img{width:96px;height:96px;border-radius:22px}#boot p{color:var(--sub);margin:14px 0 0}
#boot pre{white-space:pre-wrap;text-align:left;font-size:12px;max-height:50vh;overflow:auto;background:var(--card);color:var(--tx);padding:10px;border-radius:10px}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],#boot[hidden],#toast[hidden]{display:none}
.sh{width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;background:var(--card);color:var(--tx);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
.shh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.shh b{flex:1;font-size:16px}.shh button{background:var(--tile);color:var(--tx);border:0;border-radius:10px;padding:6px 12px;font:inherit}
#sbody{overflow:auto;padding:10px 14px 18px}
.it{display:block;width:100%;text-align:left;margin:6px 0;padding:13px 14px;border:0;border-radius:12px;background:var(--tile);color:var(--tx);font:inherit;font-size:15px}
.grp{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--tile);color:var(--tx)}.lb{font-size:14px;margin-bottom:8px;color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}.row input{flex:1;min-width:0;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.row button,.seg button,#boot button{padding:9px 14px;border-radius:10px;border:0;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);color:var(--tx)}.seg button.on{background:var(--acc);color:var(--onacc)}
pre.txt{white-space:pre-wrap;word-break:break-word;font:13px/1.55 -apple-system,"Sarabun","Noto Sans Thai",sans-serif;margin:8px 0 0}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;gap:10px;align-items:center;background:var(--acc);color:var(--onacc);padding:10px 14px;border-radius:12px;font-size:14px;max-width:92vw;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#toast button{border:0;border-radius:8px;padding:6px 10px;background:var(--onacc);color:var(--acc);font:inherit;font-weight:700}
</style>
</head>
<body>
<div id="boot"><div class="bx"><img src="icon-192.png" alt=""><p>กำลังจับยาม…</p><noscript><p>ต้องเปิด JavaScript</p></noscript></div></div>
<iframe id="dash" title="สัตตเลขลักษณากาล"></iframe>
<div id="sheet" hidden><div class="sh" role="dialog" aria-modal="true"><div class="shh"><b id="stitle"></b><button id="sclose">ปิด</button></div><div id="sbody"></div></div></div>
<div id="toast" hidden></div>
<script src="shim.js"></script>
<script src="yam7.js"></script>
<script src="build.js"></script>
<script src="app.js"></script>
</body>
</html>
